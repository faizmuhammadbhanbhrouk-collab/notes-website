<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — HTML, CSS, JavaScript</title>
<meta name="description" content="Faiz ke HTML, CSS aur JavaScript notes — 3 tabs, PDF viewer, Roman English.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff5100'/%3E%3Crect x='16' y='12' width='32' height='40' rx='3' fill='white'/%3E%3Crect x='22' y='21' width='20' height='3' fill='%23ff5100'/%3E%3Crect x='22' y='29' width='20' height='3' fill='%23ff5100'/%3E%3Crect x='22' y='37' width='14' height='3' fill='%23ff5100'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #fff; color: #222; }
header { background: #ff5100; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
header img { width: 36px; height: 36px; }
header h1 { font-size: 24px; }
header p { font-size: 13px; opacity: .9; }
.tabs { display: flex; gap: 8px; padding: 14px 20px 0; flex-wrap: wrap; }
.tab { border: 2px solid #ff5100; background: #fff; color: #ff5100; padding: 10px 22px; font-size: 16px; font-weight: 700; border-radius: 10px 10px 0 0; cursor: pointer; }
.tab.active { background: #ff5100; color: #fff; }
.bar { display: flex; gap: 10px; align-items: center; padding: 12px 20px; flex-wrap: wrap; border-top: 2px solid #ff5100; background: #fff7f2; }
.bar input, .bar select { padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
.bar input { flex: 1; min-width: 160px; }
.bar select { flex: 2; min-width: 220px; }
.btn { background: #ff5100; color: #fff; border: none; padding: 10px 16px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.ghost { background: #fff; color: #ff5100; border: 2px solid #ff5100; }
.viewer { padding: 0 20px 10px; }
.viewer embed { width: 100%; height: 75vh; border: 1px solid #ddd; border-radius: 8px; display: block; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 12px 20px 20px; flex-wrap: wrap; }
.pager span { font-weight: 700; }
footer { text-align: center; color: #888; font-size: 13px; padding: 10px 0 20px; }
@media (max-width: 600px) {
  header h1 { font-size: 20px; }
  .tab { padding: 8px 14px; font-size: 14px; }
  .viewer embed { height: 65vh; }
}
</style>
</head>
<body>
<header>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='white'/%3E%3Crect x='16' y='12' width='32' height='40' rx='3' fill='%23ff5100'/%3E%3Crect x='22' y='21' width='20' height='3' fill='white'/%3E%3Crect x='22' y='29' width='20' height='3' fill='white'/%3E%3Crect x='22' y='37' width='14' height='3' fill='white'/%3E%3C/svg%3E" alt="Notes icon">
  <div><h1>Notes</h1><p>HTML, CSS aur JavaScript — Roman English</p></div>
</header>

<div class="tabs">
  <button class="tab active" data-subject="html">HTML</button>
  <button class="tab" data-subject="css">CSS</button>
  <button class="tab" data-subject="js">JavaScript</button>
</div>

<div class="bar">
  <input type="text" id="topicSearch" placeholder="Topic dhoondo..." aria-label="Topic dhoondo">
  <select id="topicSelect" aria-label="Topic chuno"></select>
  <button class="btn ghost" id="filterReset">Filter Hatayo</button>
  <a class="btn" id="pdfDownload" href="html-notes.pdf" download>PDF Download Karo</a>
</div>

<div class="viewer">
  <embed id="pdfViewer" src="html-notes.pdf#page=1" type="application/pdf">
</div>

<div class="pager">
  <button class="btn ghost" id="prevPage">Pichla Page</button>
  <span id="pageLabel">Page 1 / 35</span>
  <button class="btn ghost" id="nextPage">Agla Page</button>
</div>

<footer>Notes by Faiz Muhammad — HTML, CSS, JavaScript</footer>

<script>
var DATA = {
  html: { file: "html-notes.pdf", total: 35, topics: [
    ["HTML Structure",3],["Content Tags",4],["Text Formatting",5],["Links & Media",6],["Lists",7],["Tables",8],["Layout Elements",10],["Forms",12],["Input Types",14],["Semantic HTML5",16],["Audio & Video",18],["Meta Tags & SEO",20],["Responsive Images",22],["Form Validation",24],["Advanced Form Elements",26],["Details, Summary & Dialog",28],["SVG & Canvas",30],["Accessibility",32],["HTML Entities & Symbols",34]] },
  css: { file: "css-notes.pdf", total: 42, topics: [
    ["CSS Introduction",3],["Colors & Backgrounds",5],["Borders",6],["Spacing - margin, padding",8],["Dimensions",9],["Box Model",11],["Outline",12],["Text Styling",13],["Fonts",14],["Icons",15],["Links Styling",16],["Lists Styling",17],["Table Styling",18],["Display Property",20],["Flexbox",21],["Positioning",24],["z-index - Layer Management",25],["Overflow",26],["Float",27],["CSS Transform (2D)",28],["Transition",29],["Animation",30],["CSS Grid",32],["Media Queries - Responsive Design",33],["CSS Variables",34],["Pseudo-classes & Pseudo-elements",35],["CSS Specificity",36],["Gradients & Shadows",37],["CSS Units",38],["CSS Functions - calc(), min(), max(), clamp()",39],["Filters & Clip-path",40],["3D Transform",41]] },
  js: { file: "javascript-notes.pdf", total: 33, topics: [
    ["JavaScript Introduction",3],["Output Methods",4],["Variables",5],["Data Types",6],["Operators",7],["Conditions",8],["Logical Conditions",9],["Switch Statement",10],["Loops",11],["Functions",12],["Scope",13],["Objects",14],["Arrays",15],["Dates",16],["Math Object",17],["Errors and Debugging",18],["JavaScript Style Guide",19],["DOM Introduction",20],["DOM Selectors",21],["DOM Manipulation",22],["HTML Events",23],["Advanced Functions",24],["Advanced Objects",25],["Classes",26],["Modules",27],["Typed Arrays",28],["DOM Navigation",29],["Window Object",30],["JavaScript Web APIs",31],["Async JavaScript",32],["jQuery Basics",33]] }
};
var subject = "html", page = 1;
var viewer = document.getElementById("pdfViewer"),
    select = document.getElementById("topicSelect"),
    search = document.getElementById("topicSearch"),
    label = document.getElementById("pageLabel"),
    download = document.getElementById("pdfDownload");

function buildTopics(filter) {
  var list = DATA[subject].topics, f = (filter || "").toLowerCase();
  select.innerHTML = "";
  var all = document.createElement("option");
  all.value = "1"; all.textContent = "Topic chuno — us ke page par jao";
  select.appendChild(all);
  list.forEach(function(t, i) {
    if (f && t[0].toLowerCase().indexOf(f) === -1) return;
    var o = document.createElement("option");
    o.value = t[1]; o.textContent = (i + 1) + ". " + t[0] + " — Page " + t[1];
    select.appendChild(o);
  });
}
function goTo(p) {
  var total = DATA[subject].total;
  if (p < 1) p = 1; if (p > total) p = total;
  page = p;
  viewer.src = DATA[subject].file + "#page=" + p;
  label.textContent = "Page " + p + " / " + total;
  var topics = DATA[subject].topics, current = 1;
  topics.forEach(function(t) { if (t[1] <= p) current = t[1]; });
  select.value = String(current);
}
function switchSubject(s) {
  subject = s; page = 1; search.value = "";
  document.querySelectorAll(".tab").forEach(function(b) {
    b.classList.toggle("active", b.dataset.subject === s);
  });
  download.href = DATA[s].file;
  buildTopics("");
  goTo(1);
}
document.querySelectorAll(".tab").forEach(function(b) {
  b.addEventListener("click", function() { switchSubject(b.dataset.subject); });
});
select.addEventListener("change", function() { goTo(parseInt(select.value, 10)); });
search.addEventListener("input", function() { buildTopics(search.value); });
document.getElementById("filterReset").addEventListener("click", function() {
  search.value = ""; buildTopics(""); goTo(1);
});
document.getElementById("prevPage").addEventListener("click", function() { goTo(page - 1); });
document.getElementById("nextPage").addEventListener("click", function() { goTo(page + 1); });
buildTopics("");
goTo(1);
</script>
</body>
</html>
